<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Update Password - EarnHub</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef4f0;--ink:#0d2b21;--mut:#4b6258;--card:#fff;--line:#cfdcd4;--brand:#0f5c43;--brand-ink:#fff;--gold:#f4b52b}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:30px;max-width:400px;width:90%;text-align:center}
h1{font-family:'Bricolage Grotesque',sans-serif;margin:0 0 10px}
input{width:100%;padding:12px;margin:10px 0;border-radius:8px;border:1px solid var(--line);font-size:16px;box-sizing:border-box}
button{width:100%;padding:12px;background:var(--brand);color:var(--brand-ink);border:0;border-radius:8px;font-weight:700;font-size:16px;cursor:pointer}
.msg{margin-top:15px;font-size:14px;color:var(--brand); font-weight:bold;}
</style>
</head>
<body>
  <div class="card">
    <h1>Set New Password</h1>
    <p style="color:var(--mut);font-size:14px;margin-bottom:20px;">Enter your new password below.</p>
    <input type="password" id="new-pw" placeholder="New Password (min 8 chars)">
    <button id="update-btn">Update Password</button>
    <p class="msg" id="msg"></p>
  </div>

  <script type="module">
    import { supabase } from './js/supabase.js'
    const $ = id => document.getElementById(id)

    $('update-btn').onclick = async () => {
      const pw = $('new-pw').value;
      if (pw.length < 8) return $('msg').textContent = "Password must be at least 8 characters.";
      
      $('update-btn').textContent = 'Updating...';

      // Supabase automatically logs the user in when they click the email link
      const { error } = await supabase.auth.updateUser({ password: pw });

      if (error) {
        $('msg').textContent = "Error: " + error.message;
        $('update-btn').textContent = 'Update Password';
      } else {
        $('msg').textContent = "Password updated successfully! Redirecting to login...";
        $('msg').style.color = "green";
        setTimeout(() => location.href = 'index.html', 2000);
      }
    }
  </script>
</body>
</html>
